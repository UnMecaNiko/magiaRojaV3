# Solo la aplicación. El TLS y el enrutamiento por dominio los resuelve el
# proxy compartido en infra/proxy/ — ver D-0014.
# Este stack no publica puertos: el proxy lo alcanza por la red "edge"
# usando el nombre de contenedor "web-velo".

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}
    container_name: web-velo
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - edge

networks:
  edge:
    external: true
