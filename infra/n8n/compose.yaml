# n8n con PostgreSQL. No publica puertos: solo es alcanzable por el proxy.
# La base de datos vive en la red interna, sin salida al proxy.

services:
  postgres:
    image: postgres:17-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - interna

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}

      # Si esta clave se pierde, TODAS las credenciales guardadas en los
      # flujos quedan ilegibles y hay que volver a crearlas a mano.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta N8N_ENCRYPTION_KEY en .env}

      N8N_HOST: ${DOMINIO_N8N:?falta DOMINIO_N8N en .env}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMINIO_N8N}/
      N8N_EDITOR_BASE_URL: https://${DOMINIO_N8N}/

      # Detrás de un proxy inverso: un solo salto.
      N8N_PROXY_HOPS: 1

      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}

      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - interna
      - edge

volumes:
  n8n_db:
  n8n_data:

networks:
  interna:
  edge:
    external: true
